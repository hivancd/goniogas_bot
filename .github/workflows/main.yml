name: Goniogas check

on:
  schedule:
    # Runs at 06:00 UTC every day (cron uses UTC)
    - cron: '5 14-23,0-1 * * *'
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script
        run: python main.py
